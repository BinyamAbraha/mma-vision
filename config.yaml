# MMA Vision config. Every value here overrides the defaults in mma_vision/config.py.
# Thresholds marked (torso) are in torso-heights, so they transfer across camera zoom/resolution.

red_name: RED
blue_name: BLUE
round_length_sec: 300

model:
  weights: yolo26n-pose.pt        # n = fastest (CPU/MPS). Try yolo26s-pose.pt or m on a GPU.
  fallback_weights: yolo11n-pose.pt
  imgsz: 640                      # 960 helps small/far fighters on GPU
  conf: 0.35
  tracker: bytetrack.yaml
  device: auto                    # auto | cpu | mps | cuda
  half: false                     # fp16, CUDA only

fighters:
  min_box_height_frac: 0.15       # drop people shorter than 15% of frame height (crowd, far corners)
  warmup_frames: 15
  max_jump_frac: 0.35
  w_app: 0.6                      # appearance vs position weight when deciding who is who (0 = position only)
  swap_margin: 0.12               # how much better the swapped pairing must score before we flip red/blue
  sep_iou: 0.05                   # only learn a fighter's colours when the two boxes barely overlap
  tmpl_rate: 0.03
  repair_identity: true           # offline pass: fix swaps using the whole clip's appearance evidence
  repair_switch_penalty: 0.6

strikes:
  smooth_alpha: 0.65              # keypoint EMA; lower = smoother but merges fast combos
  vel_thresh: 0.16                # punch: (torso/frame) wrist speed to count as a strike. Real punches run 0.4+; jitter ~0.15.
  vel_thresh_kick: 0.2            # kick: ankle speed threshold — kicks are much faster than steps
  clinch_range: 0.9               # (torso, hip-to-hip) closer than this counts as the clinch/pocket
  clinch_speed_mult: 1.25         # in the clinch, speed thresholds x1.25 — every hand twitch is 'near the target' there
  max_head_react: 0.5             # head 'reactions' faster than this are keypoint jumps, not snaps
  min_kick_lift: 0.3              # kick: kicking ankle must rise this far (torso) above the standing ankle
  toward_cos: 0.3                 # limb must move toward the opponent (low enough for hooks)
  min_ext_punch: 0.5              # (torso) wrist-to-shoulder distance at impact — body shots and hooks are bent-arm
  min_ext_kick: 0.6               # (torso) ankle-to-hip distance at impact (kept low — kicks foreshorten in 2D)
  min_punch_travel: 0.35          # punch: wrist must have moved this far (torso) in the lookback window
  impact_window: 6                # frames after the speed peak to find impact (punch)
  impact_window_kick: 12          # kicks unfold slower (chamber -> extension)
  min_kick_travel: 0.5            # kick: ankle must have travelled this far (torso) in the lookback window
  ext_lookback: 8
  land_dist: 0.35                 # (torso) gap between limb tip and target surface to call it landed. Raise if real hits read as misses.
  land_dist_kick_tight: 0.12      # body/leg kicks count as landed on distance alone only if this close...
  body_react_vel: 0.05            # ...otherwise the opponent's hips must visibly get shoved
  cut_guard: 10                   # ignore anything within this many frames of a camera cut
  head_react_vel: 0.03            # opponent head snap that confirms a landed shot
  react_window: 6
  cooldown: 8                     # frames before the same hand can punch again
  cooldown_kick: 15               # frames before the same leg can kick again
  min_gap_any: 4                  # min frames between any two strikes by one fighter
  combo_window: 15                # frames after a strike in which the next one is treated as part of a combo
  combo_relax: 0.6                # extension/retraction gates are multiplied by this inside a combo
  max_miss_dist: 0.9              # (torso) punch misses further than this from the target are hand-fighting, dropped
  max_miss_dist_kick: 1.4         # kicks that get checked or parried stop further out
  miss_speed_mult: 1.3            # a miss must be this x faster than the speed threshold (landed shots needn't)
  min_peak_support: 1             # of the 4 frames around the speed peak, this many must carry >= support_frac of it
  support_frac: 0.2               # one-frame keypoint jumps have ~3% neighbours; a 3-frame punch ~30%
  max_limb_len: 1.0               # anatomical limb-length limit multiplier; joints further than possible from their parent are dropped
  min_conf: 0.3
  min_miss_conf: 0.0              # optional: drop misses below this confidence (0 = off)

overlay:
  draw_skeleton: true
  draw_boxes: true
  stat_panel: true
  minimap: true
  flash_frames: 12

commentary:
  enabled: false                  # or pass --commentary
  provider: template              # template (free, offline) | claude (needs ANTHROPIC_API_KEY)
  model: claude-sonnet-4-5
  tts: none                       # none | elevenlabs (ELEVENLABS_API_KEY) | kokoro (local, free)
  voice: Rachel                   # ElevenLabs voice id/name, or a Kokoro voice like am_michael
  every_sec: 8
  style: energetic UFC broadcast color commentator, short punchy sentences
